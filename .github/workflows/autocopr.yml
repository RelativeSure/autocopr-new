name: Update spec files

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'

permissions: {}

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: aidandenlinger/autocopr@v1
        with:
          mode: "push"
          ignore: |
            lucky-commit.spec
            ghostty.spec
